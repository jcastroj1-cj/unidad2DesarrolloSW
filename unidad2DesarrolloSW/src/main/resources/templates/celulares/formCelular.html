<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Datos del Celular</title>
        <meta charset="UTF-8">
        <style>
            * { margin: 0; padding: 0; box-sizing: border-box; }
            body { background-color: #1a1a2e; color: #e0e0e0; font-family: 'Segoe UI', sans-serif; }
            .container { padding: 30px; max-width: 600px; }
            h1 { color: #e94560; margin-bottom: 20px; letter-spacing: 1px; font-size: 22px; }
            .btn-back {
                display: inline-block;
                padding: 8px 18px;
                background-color: #0f3460;
                color: #7eb3ff;
                text-decoration: none;
                border-radius: 6px;
                font-size: 13px;
                margin-bottom: 24px;
                border: 1px solid #1a4a8a;
            }
            .btn-back:hover { background-color: #1a4a8a; }
            label {
                display: block;
                margin-bottom: 5px;
                color: #a0a0b0;
                font-size: 12px;
                text-transform: uppercase;
                letter-spacing: 1px;
            }
            input[type=text], input[type=number] {
                width: 100%;
                padding: 9px 14px;
                margin-bottom: 16px;
                background-color: #0f3460;
                border: 1px solid #1a4a8a;
                border-radius: 6px;
                color: #e0e0e0;
                font-size: 14px;
                outline: none;
                transition: border 0.3s;
            }
            input[type=text]:focus, input[type=number]:focus { border-color: #e94560; }
            .check-row {
                display: flex;
                align-items: center;
                gap: 10px;
                margin-bottom: 16px;
            }
            .check-row input[type=checkbox] { width: 18px; height: 18px; accent-color: #e94560; }
            .check-row label { margin: 0; font-size: 13px; text-transform: none; letter-spacing: 0; color: #e0e0e0; }
            .form-actions { display: flex; gap: 12px; margin-top: 10px; }
            input[type=reset] {
                padding: 10px 24px;
                background-color: #0f3460;
                color: #a0a0b0;
                border: 1px solid #1a4a8a;
                border-radius: 6px;
                cursor: pointer;
                font-size: 14px;
            }
            input[type=submit] {
                padding: 10px 24px;
                background-color: #e94560;
                color: white;
                border: none;
                border-radius: 6px;
                cursor: pointer;
                font-size: 14px;
                font-weight: bold;
                transition: background 0.3s;
            }
            input[type=submit]:hover { background-color: #c73652; }
        </style>
    </head>
    <body>
        <header th:replace="plantillas/partes :: cabecero"></header>
        <div class="container">
            <h1>Datos del Celular</h1>
            <a th:href="@{/celulares/}" class="btn-back">← REGRESAR</a>

            <form th:action="@{/celulares/guardar}" method="POST" th:object="${celular}">
                <input type="hidden" th:field="*{id}" />

                <label>Marca</label>
                <input type="text" th:field="*{marca}" placeholder="Ej: Samsung" required />

                <label>IMEI</label>
                <input type="text" th:field="*{imei}" placeholder="15 dígitos" required />

                <label>Pulgadas</label>
                <input type="number" step="0.1" th:field="*{pulgadas}" placeholder="Ej: 6.5" required />

                <label>Megapixeles</label>
                <input type="number" step="0.1" th:field="*{megapixeles}" placeholder="Ej: 108" required />

                <label>RAM</label>
                <input type="text" th:field="*{ram}" placeholder="Ej: 8GB" required />

                <label>Almacenamiento Principal</label>
                <input type="text" th:field="*{almacenamientoPrincipal}" placeholder="Ej: 128GB" required />

                <label>Almacenamiento Secundario (MicroSD)</label>
                <input type="text" th:field="*{almacenamientoSecundario}" placeholder="Ej: 512GB" />

                <label>Sistema Operativo</label>
                <input type="text" th:field="*{sistemaOperativo}" placeholder="Ej: Android 14" required />

                <label>Operador</label>
                <input type="text" th:field="*{operador}" placeholder="Ej: Claro, Movistar" />

                <label>Tecnología Banda</label>
                <input type="text" th:field="*{tecnologiaBanda}" placeholder="Ej: 5G, 4G LTE" />

                <label>Marca CPU</label>
                <input type="text" th:field="*{marcaCpu}" placeholder="Ej: Qualcomm" />

                <label>Velocidad CPU</label>
                <input type="text" th:field="*{velocidadCpu}" placeholder="Ej: 3.2 GHz" />

                <label>Número de Cámaras</label>
                <input type="number" th:field="*{camaras}" min="1" />

                <label>Cantidad de SIM</label>
                <input type="number" th:field="*{cantidadSim}" min="1" max="3" />

                <div class="check-row">
                    <input type="checkbox" th:field="*{wifi}" />
                    <label>Wifi</label>
                </div>
                <div class="check-row">
                    <input type="checkbox" th:field="*{bluetooth}" />
                    <label>Bluetooth</label>
                </div>
                <div class="check-row">
                    <input type="checkbox" th:field="*{nfc}" />
                    <label>NFC</label>
                </div>
                <div class="check-row">
                    <input type="checkbox" th:field="*{huella}" />
                    <label>Huella Dactilar</label>
                </div>
                <div class="check-row">
                    <input type="checkbox" th:field="*{ir}" />
                    <label>IR (Control Remoto)</label>
                </div>
                <div class="check-row">
                    <input type="checkbox" th:field="*{resisteAgua}" />
                    <label>Resistencia al Agua</label>
                </div>

                <div class="form-actions">
                    <input type="reset" value="LIMPIAR" />
                    <input type="submit" value="GUARDAR" />
                </div>
            </form>
        </div>
        <footer th:replace="plantillas/partes :: pie"></footer>
    </body>
</html>
