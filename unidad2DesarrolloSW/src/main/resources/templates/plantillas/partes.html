<html xmlns="https://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <head>
        <meta charset="UTF-8">
    </head>
    <body>
        <header th:fragment="cabecero">
            <style>
                header {
                    background-color: #16213e;
                    border-bottom: 2px solid #e94560;
                    padding: 14px 30px;
                    display: flex;
                    justify-content: space-between;
                    align-items: center;
                }
                header h1 {
                    color: #e94560;
                    font-size: 20px;
                    letter-spacing: 2px;
                    font-family: 'Segoe UI', sans-serif;
                }
                .header-user {
                    color: #a0a0b0;
                    font-family: 'Segoe UI', sans-serif;
                    font-size: 14px;
                    display: flex;
                    align-items: center;
                    gap: 14px;
                }
                .header-user strong { color: #e0e0e0; }
                .btn-logout {
                    background-color: #e94560;
                    color: white;
                    border: none;
                    padding: 7px 16px;
                    border-radius: 5px;
                    cursor: pointer;
                    font-size: 13px;
                    font-weight: bold;
                    transition: background 0.3s;
                }
                .btn-logout:hover { background-color: #c73652; }
            </style>
            <h1>📱 APP WEB MVC CON SPRING BOOT</h1>
            <div class="header-user" sec:authorize="isAuthenticated()">
                <span>Usuario: <strong sec:authentication="name"></strong></span>
                <form th:action="@{/logout}" method="POST" style="margin:0;">
                    <button type="submit" class="btn-logout">CERRAR SESIÓN</button>
                </form>
            </div>
        </header>

        <footer th:fragment="pie">
            <style>
                footer {
                    background-color: #16213e;
                    border-top: 2px solid #0f3460;
                    padding: 14px 30px;
                    text-align: center;
                    color: #a0a0b0;
                    font-family: 'Segoe UI', sans-serif;
                    font-size: 13px;
                    margin-top: 40px;
                }
                footer a { color: #e94560; text-decoration: none; }
                footer a:hover { text-decoration: underline; }
            </style>
            <span>By: JEAN CARLOS CASTRO JINETE</span>
        </footer>
    </body>
</html>
