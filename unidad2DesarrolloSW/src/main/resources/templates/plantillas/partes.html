<html xmlns="https://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <head>
        <meta charset="UTF-8">
    </head>
    <body>
        <header th:fragment="cabecero">
            <style>
                header {
                    background-color: #16213e;
                    border-bottom: 2px solid #e94560;
                    padding: 14px 30px;
                    display: flex;
                    justify-content: space-between;
                    align-items: center;
                    font-family: 'Segoe UI', sans-serif;
                }
                header h1 { color: #e94560; font-size: 20px; letter-spacing: 2px; }
                nav { display: flex; gap: 10px; }
                nav a {
                    padding: 7px 16px;
                    background-color: #0f3460;
                    color: #7eb3ff;
                    text-decoration: none;
                    border-radius: 5px;
                    font-size: 13px;
                    border: 1px solid #1a4a8a;
                    transition: background 0.2s;
                }
                nav a:hover { background-color: #1a4a8a; }
                .header-right {
                    color: #a0a0b0;
                    font-size: 14px;
                    display: flex;
                    align-items: center;
                    gap: 14px;
                }
                .header-right strong { color: #e0e0e0; }
                .btn-logout {
                    background-color: #e94560;
                    color: white;
                    border: none;
                    padding: 7px 16px;
                    border-radius: 5px;
                    cursor: pointer;
                    font-size: 13px;
                    font-weight: bold;
                    transition: background 0.3s;
                }
                .btn-logout:hover { background-color: #c73652; }
            </style>

            <h1>📱 APP WEB MVC CON SPRING BOOT</h1>

            <nav>
                <a th:href="@{/}">👤 Usuarios</a>
                <a th:href="@{/celulares/}">📱 Celulares</a>
            </nav>

            <div class="header-right" sec:authorize="isAuthenticated()">
                <span>Usuario: <strong sec:authentication="name"></strong></span>
                <form th:action="@{/logout}" method="POST" style="margin:0;">
                    <button type="submit" class="btn-logout">CERRAR SESIÓN</button>
                </form>
            </div>
        </header>

        <footer th:fragment="pie">
            <style>
                footer {
                    background-color: #16213e;
                    border-top: 2px solid #0f3460;
                    padding: 14px 30px;
                    text-align: center;
                    color: #a0a0b0;
                    font-family: 'Segoe UI', sans-serif;
                    font-size: 13px;
                    margin-top: 40px;
                }
                footer a { color: #e94560; text-decoration: none; }
            </style>
            <span>By: JEAN CARLOS CASTRO JINETE</span>
        </footer>
    </body>
</html>
