<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Datos del Celular</title>
        <meta charset="UTF-8">
    </head>
    <body>
        <h1>Datos del Celular</h1>
        <a th:href="@{/celulares/}">REGRESAR</a>
        <br/>
        <form th:action="@{/celulares/guardar}" method="POST" th:object="${celular}">
            <input type="hidden" th:field="*{id}" />

            <br/><label>MARCA</label>
            <input type="text" th:field="*{marca}" required />

            <br/><label>IMEI</label>
            <input type="text" th:field="*{imei}" required />

            <br/><label>PULGADAS</label>
            <input type="number" step="0.1" th:field="*{pulgadas}" required />

            <br/><label>MEGAPIXELES</label>
            <input type="number" step="0.1" th:field="*{megapixeles}" required />

            <br/><label>RAM</label>
            <input type="text" th:field="*{ram}" placeholder="Ej: 8GB" required />

            <br/><label>ALMACENAMIENTO PRINCIPAL</label>
            <input type="text" th:field="*{almacenamientoPrincipal}" placeholder="Ej: 128GB" required />

            <br/><label>ALMACENAMIENTO SECUNDARIO</label>
            <input type="text" th:field="*{almacenamientoSecundario}" placeholder="Ej: 512GB" />

            <br/><label>SISTEMA OPERATIVO</label>
            <input type="text" th:field="*{sistemaOperativo}" placeholder="Ej: Android 14" required />

            <br/><label>OPERADOR</label>
            <input type="text" th:field="*{operador}" placeholder="Ej: Claro, Movistar" />

            <br/><label>TECNOLOGÍA BANDA</label>
            <input type="text" th:field="*{tecnologiaBanda}" placeholder="Ej: 5G, 4G LTE" />

            <br/><label>WIFI</label>
            <input type="checkbox" th:field="*{wifi}" />

            <br/><label>BLUETOOTH</label>
            <input type="checkbox" th:field="*{bluetooth}" />

            <br/><label>NÚMERO DE CÁMARAS</label>
            <input type="number" th:field="*{camaras}" min="1" />

            <br/><label>MARCA CPU</label>
            <input type="text" th:field="*{marcaCpu}" placeholder="Ej: Qualcomm, MediaTek" />

            <br/><label>VELOCIDAD CPU</label>
            <input type="text" th:field="*{velocidadCpu}" placeholder="Ej: 3.2 GHz" />

            <br/><label>NFC</label>
            <input type="checkbox" th:field="*{nfc}" />

            <br/><label>HUELLA DACTILAR</label>
            <input type="checkbox" th:field="*{huella}" />

            <br/><label>IR (Control Remoto)</label>
            <input type="checkbox" th:field="*{ir}" />

            <br/><label>RESISTENCIA AL AGUA</label>
            <input type="checkbox" th:field="*{resisteAgua}" />

            <br/><label>CANTIDAD DE SIM</label>
            <input type="number" th:field="*{cantidadSim}" min="1" max="3" />

            <br/><br/>
            <input type="reset" value="LIMPIAR" /> &nbsp;&nbsp;&nbsp;
            <input type="submit" value="GUARDAR" />
        </form>
    </body>
</html>
