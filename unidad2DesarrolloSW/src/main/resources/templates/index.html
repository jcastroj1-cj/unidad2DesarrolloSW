<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Lista de Usuarios</title>
        <meta charset="UTF-8">
        <style>
            * { margin: 0; padding: 0; box-sizing: border-box; }
            body { background-color: #1a1a2e; color: #e0e0e0; font-family: 'Segoe UI', sans-serif; }
            .container { padding: 30px; }
            h2 { color: #e94560; margin-bottom: 20px; letter-spacing: 1px; }
            .btn {
                display: inline-block;
                padding: 9px 20px;
                background-color: #e94560;
                color: white;
                text-decoration: none;
                border-radius: 6px;
                font-size: 13px;
                font-weight: bold;
                margin-bottom: 20px;
                transition: background 0.3s;
            }
            .btn:hover { background-color: #c73652; }
            table {
                width: 100%;
                border-collapse: collapse;
                background-color: #16213e;
                border-radius: 8px;
                overflow: hidden;
            }
            thead { background-color: #0f3460; }
            thead th { padding: 12px 16px; color: #a0a0b0; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; text-align: left; }
            tbody tr { border-bottom: 1px solid #0f3460; transition: background 0.2s; }
            tbody tr:hover { background-color: #1e3a6e; }
            tbody td { padding: 11px 16px; font-size: 14px; }
            .btn-edit {
                padding: 5px 12px;
                background-color: #0f3460;
                color: #7eb3ff;
                border: 1px solid #1a4a8a;
                border-radius: 4px;
                text-decoration: none;
                font-size: 12px;
                transition: background 0.2s;
            }
            .btn-edit:hover { background-color: #1a4a8a; }
            .btn-delete {
                padding: 5px 12px;
                background-color: #3d0000;
                color: #ff6b6b;
                border: 1px solid #ff4444;
                border-radius: 4px;
                text-decoration: none;
                font-size: 12px;
                transition: background 0.2s;
            }
            .btn-delete:hover { background-color: #5a0000; }
            .empty-msg { color: #a0a0b0; margin-top: 20px; font-style: italic; }
        </style>
    </head>
    <body>
        <header th:replace="plantillas/partes :: cabecero"></header>
        <div class="container">
            <h2>LISTA DE USUARIOS</h2>
            <a th:href="@{/agregar}" class="btn">+ AGREGAR USUARIO</a>
            <div th:if="${usuarios != null and !usuarios.empty}">
                <table>
                    <thead>
                        <tr>
                            <th>Cédula</th>
                            <th>Clave</th>
                            <th>Nombre</th>
                            <th>Email</th>
                            <th>Editar</th>
                            <th>Eliminar</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="u : ${usuarios}">
                            <td th:text="${u.cedula}"></td>
                            <td th:text="${u.clave}"></td>
                            <td th:text="${u.nombre}"></td>
                            <td th:text="${u.email}"></td>
                            <td><a th:href="@{/editar/} + ${u.cedula}" class="btn-edit">EDITAR</a></td>
                            <td><a th:href="@{/eliminar/} + ${u.cedula}" class="btn-delete">ELIMINAR</a></td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <p th:if="${usuarios == null or usuarios.empty}" class="empty-msg">La lista de usuarios está vacía.</p>
        </div>
        <footer th:replace="plantillas/partes :: pie"></footer>
    </body>
</html>
