<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Iniciar Sesión</title>
        <meta charset="UTF-8">
        <style>
            * { margin: 0; padding: 0; box-sizing: border-box; }
            body {
                background-color: #1a1a2e;
                color: #e0e0e0;
                font-family: 'Segoe UI', sans-serif;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
            }
            .login-box {
                background-color: #16213e;
                border: 1px solid #0f3460;
                border-radius: 12px;
                padding: 40px 50px;
                width: 380px;
                box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            }
            .login-box h2 {
                text-align: center;
                color: #e94560;
                font-size: 22px;
                margin-bottom: 6px;
                letter-spacing: 1px;
            }
            .login-box h3 {
                text-align: center;
                color: #a0a0b0;
                font-size: 14px;
                margin-bottom: 28px;
                font-weight: normal;
            }
            label {
                display: block;
                margin-bottom: 6px;
                color: #a0a0b0;
                font-size: 13px;
                text-transform: uppercase;
                letter-spacing: 1px;
            }
            input[type=text], input[type=password] {
                width: 100%;
                padding: 10px 14px;
                margin-bottom: 20px;
                background-color: #0f3460;
                border: 1px solid #1a4a8a;
                border-radius: 6px;
                color: #e0e0e0;
                font-size: 15px;
                outline: none;
                transition: border 0.3s;
            }
            input[type=text]:focus, input[type=password]:focus {
                border-color: #e94560;
            }
            button[type=submit] {
                width: 100%;
                padding: 12px;
                background-color: #e94560;
                color: white;
                border: none;
                border-radius: 6px;
                font-size: 15px;
                font-weight: bold;
                cursor: pointer;
                letter-spacing: 1px;
                transition: background 0.3s;
            }
            button[type=submit]:hover {
                background-color: #c73652;
            }
            .msg-error {
                background-color: #3d0000;
                color: #ff6b6b;
                border: 1px solid #ff4444;
                border-radius: 6px;
                padding: 10px;
                margin-bottom: 16px;
                text-align: center;
                font-size: 13px;
            }
            .msg-success {
                background-color: #003d1a;
                color: #6bff9e;
                border: 1px solid #44ff88;
                border-radius: 6px;
                padding: 10px;
                margin-bottom: 16px;
                text-align: center;
                font-size: 13px;
            }
        </style>
    </head>
    <body>
        <div class="login-box">
            <h2>📱 CRUD CELULARES</h2>
            <h3>Iniciar Sesión</h3>

            <div th:if="${param.error}" class="msg-error">
                ✖ Cédula o clave incorrecta.
            </div>
            <div th:if="${param.logout}" class="msg-success">
                ✔ Sesión cerrada correctamente.
            </div>

            <form th:action="@{/login}" method="POST">
                <label>Cédula</label>
                <input type="text" name="username" placeholder="Ingrese su cédula" required />
                <label>Clave</label>
                <input type="password" name="password" placeholder="Ingrese su clave" required />
                <button type="submit">INGRESAR</button>
            </form>
        </div>
    </body>
</html>
