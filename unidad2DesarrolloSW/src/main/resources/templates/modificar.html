<html xmlns:th="http://www.thymeleaf.org"
      xmlns="https://www.w3.org/1999/xhtml">  
    <head>
        <title>DATOS DEL USUARIO</title>
        <meta charset="UTF-8">
     </head>
    <body>
        <h1>Datos del usuario</h1>
        <a th:href="@{/}">REGRESAR</a>
        <br/>
    <form th:action="@{/guardar}" method="POST" th:object="${usuario}">
        <br/>
        <label for="cedula">CEDULA</label>
        <input type="text" name="cedula" th:field="*{cedula}" required />
        <span th:if="${fields.hasErrors('cedula')" th:erros="(cedula)">La cedula es requerida</span> 
        <br/>
        <label for="clave">CLAVE</label>
        <input type="password" name="clave" th:field="*{clave}" />
        <span th:if="${fields.hasErrors('clave')" th:erros="(clave)">La cedula es requerida</span>
        <br/>
        <label for="nombre">NOMBRE</label>
        <input type="text" name="nombre" th:field="*{nombre}" required />
        <span th:if="${fields.hasErrors('nombre')" th:erros="(nombre)">El nombre es requerido</span>
        <br/>
        <label for="email">EMAIL</label>
        <input type="text" name="email" th:field="*{email}" />
        <span th:if="${fields.hasErrors('email')" th:erros="(email)">El e-Mail es requerido</span>
        <br/>
        <input type="reset" value="LIMPIAR"/> &nbsp;&nbsp;&nbsp;
        <input type="submit" name="guardar" value="GUARDAR"/>
      </form>
    </body>
</html>
